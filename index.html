<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome Page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 900px;
            padding: 40px;
            border-radius: 20px;

            /* Glass effect */
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            text-align: center;
            color: white;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
            margin-bottom: 30px;
            opacity: 0.8;
        }

        .menu {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .menu a {
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 30px;
            background: rgba(255,255,255,0.2);
            color: white;
            transition: 0.3s;
            backdrop-filter: blur(5px);
        }

        .menu a:hover {
            background: rgba(255,255,255,0.4);
            transform: scale(1.05);
        }

        footer {
            margin-top: 30px;
            font-size: 14px;
            opacity: 0.7;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome 👋</h1>
        <p>SATYA ANAK KONTOLLLLL </p>

        <div class="menu">
            <a href="#">Home</a>
            <a href="#">Dashboard</a>
            <a href="#">Profile</a>
            <a href="#">Contact</a>
        </div>

        <footer>
            © 2026 Your Website
        </footer>
    </div>

</body>
</html>
